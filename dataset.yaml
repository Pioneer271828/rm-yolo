# 装甲板识别数据集配置文件
# RM装甲板数据集 - 包含14个类别

# 数据集路径（支持相对路径和绝对路径）
path: Dataset               # 数据集根目录（相对路径）
train: train/images         # 训练集图片路径（相对于path）
val: val/images             # 验证集图片路径（相对于path）

# 类别数量
nc: 14

# 类别名称（按顺序对应类别ID 0-13）
names:
  - B1    # 蓝方1号装甲板
  - B2    # 蓝方2号装甲板
  - B3    # 蓝方3号装甲板
  - B4    # 蓝方4号装甲板
  - B5    # 蓝方5号装甲板
  - BO    # 蓝方前哨站
  - BS    # 蓝方基地
  - R1    # 红方1号装甲板
  - R2    # 红方2号装甲板
  - R3    # 红方3号装甲板
  - R4    # 红方4号装甲板
  - R5    # 红方5号装甲板
  - RO    # 红方前哨站
  - RS    # 红方基地

# 数据集统计信息
# 训练集：6809张图片
# 验证集：1742张图片
# 总计：8551张图片